<!DOCTYPE html>
<html>
<head>
    <title>School Result Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        caption {
            caption-side: top;
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            color: #2c3e50;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: #2c3e50;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tfoot {
            background-color: #dfe6e9;
            font-weight: bold;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <caption>Annual Examination Result - 2026</caption>

    <thead>
        <tr>
            <th rowspan="2">Roll No</th>
            <th rowspan="2">Student Name</th>
            <th colspan="3">Subjects</th>
            <th rowspan="2">Total</th>
            <th rowspan="2">Grade</th>
        </tr>
        <tr>
            <th>Math</th>
            <th>Science</th>
            <th>English</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>101</td>
            <td>Rahul Sharma</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
            <td>263</td>
            <td>A</td>
        </tr>
        <tr>
            <td>102</td>
            <td>Anita Verma</td>
            <td>78</td>
            <td>82</td>
            <td>80</td>
            <td>240</td>
            <td>B+</td>
        </tr>
        <tr>
            <td>103</td>
            <td>Rohan Singh</td>
            <td>92</td>
            <td>89</td>
            <td>94</td>
            <td>275</td>
            <td>A+</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="5">Class Average</td>
            <td>259</td>
            <td>A</td>
        </tr>
    </tfoot>

</table>

</body>
</html>
